<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <!-- Relative Path -->
    <h2>Image With a Relative Path</h2>
    <img src="images/landscape.jpg" alt="landscape" />

    <!-- Absolute Path -->
    <h2>Image With an Absolute Path</h2>
    <img src="https://picsum.photos/200/300" alt="Random" />

    <!-- Width and Height -->
    <h2>Width and Height</h2>
    <img
      src="images/landscape.jpg"
      alt="landscape"
      width="400"
      height="300"
      title="A beautiful landscape"
    />

    <!-- fig and figcaption -->
    <figure>
      <img src="images/landscape.jpg" alt="landscape" />
      <figcaption>Fig.1 - Beautiful landscape</figcaption>
    </figure>
  </body>
</html>
